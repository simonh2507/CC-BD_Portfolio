apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-service
  labels:
    app: ride-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ride-service
  template:
    metadata:
      labels:
        app: ride-service
    spec:
      containers:
        - name: ride-service
          image: ghcr.io/simonh2507/ride-service:latest
          ports:
            - containerPort: 80
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_GROUP_ID
              value: ride-service
            - name: MONGO_URL
              value: mongodb://mongodb.ride-sharing.svc.cluster.local:27017
            - name: GPS_SERVICE_URL
              value: http://gps-service:80
            - name: KAFKA_TOPIC_RIDE_ACCEPTED
              value: rides.fct.ride.accepted
            - name: KAFKA_TOPIC_RIDE_COMPLETED
              value: rides.fct.ride.completed
          livenessProbe:
            httpGet:
              path: /ping
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: ride-service
  labels:
    app: ride-service
spec:
  selector:
    app: ride-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
