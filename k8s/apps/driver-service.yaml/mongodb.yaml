# -----------------------------------------------------------------------
# Secret — MongoDB connection string
# In production: manage via Sealed Secrets, Vault, or External Secrets.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: driver-db-secret
  labels:
    app: driver-db
type: Opaque
stringData:
  mongodb-url: mongodb://driver-db:27017
---
# -----------------------------------------------------------------------
# StatefulSet — MongoDB 7.0
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: driver-db
  labels:
    app: driver-db
spec:
  serviceName: driver-db
  replicas: 1
  selector:
    matchLabels:
      app: driver-db
  template:
    metadata:
      labels:
        app: driver-db
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: driverdb
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# -----------------------------------------------------------------------
# Headless Service — required for StatefulSet stable DNS
# Reachable inside the cluster as: driver-db:27017
# -----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: driver-db
  labels:
    app: driver-db
spec:
  clusterIP: None
  selector:
    app: driver-db
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017