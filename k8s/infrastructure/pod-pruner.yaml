# Wir haben nur 10GB! storage auf diesem Node. Das ist extrem wenig und der Cluster evicted die ganze Zeit die Pods weil der Node mit "Disk Pressure" tainted wird. Manchmal kommt es zu mehreren tausenden stale Pods über die Nacht.
# Außerdem läuft irgendwas voll. Ich nehme an es sind die Logs. Ich lösche sie alle 6 Stunden

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-pruner
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-pruner-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-pruner-binding
subjects:
  - kind: ServiceAccount
    name: pod-pruner
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: pod-pruner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-pruner
  namespace: kube-system
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pod-pruner

          # job runs on disk pressure
          priorityClassName: system-node-critical
          tolerations:
            - key: "node.kubernetes.io/disk-pressure"
              operator: "Exists"
              effect: "NoSchedule"

          initContainers:
            - name: log-cleaner
              image: alpine:latest
              securityContext:
                runAsUser: 0 # for root access
              command:
                - /bin/sh
                - -c
                - |
                  echo "Cleaning up host container logs..."
                  find /host/var/log/pods/ -name '*.log' -exec truncate -s 0 {} \;
                  find /host/var/log/containers/ -name '*.log' -exec truncate -s 0 {} \;
              volumeMounts:
                - name: host-logs
                  mountPath: /host/var/log

          containers:
            - name: pruner
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "Pruning failed and succeeded pods..."
                  kubectl delete pods -A --field-selector=status.phase=Failed --wait=false
                  kubectl delete pods -A --field-selector=status.phase=Succeeded --wait=false

          restartPolicy: OnFailure

          volumes:
            - name: host-logs
              hostPath:
                # path for logs on node
                path: /var/log
